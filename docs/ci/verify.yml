name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m compileall -q plugins.v2/brushflowtracker

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins.v2/brushflowtracker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: plugins.v2/brushflowtracker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Validate published entry
        run: test -s dist/assets/remoteEntry.js
